<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーティービンゴマシーン</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: #f8fafc;
        }

        .number-font {
            font-family: 'Montserrat', sans-serif;
        }

        /* アニメーション関連 */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
            50% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.8), 0 0 100px rgba(234, 179, 8, 0.3); }
            100% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        }

        .glow-effect {
            animation: pulseGlow 2s infinite;
        }

        /* ビンゴボードのセルスタイル */
        .board-cell {
            transition: all 0.3s ease;
        }
        
        .board-cell.drawn {
            background-color: #eab308; /* Yellow 500 */
            color: #451a03; /* Yellow 900 */
            border-color: #fef08a; /* Yellow 200 */
            font-weight: 800;
            text-shadow: 0px 1px 2px rgba(255,255,255,0.5);
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
            transform: scale(1.05);
            z-index: 10;
        }

        .board-cell.latest {
            background-color: #ef4444; /* Red 500 */
            color: white;
            border-color: #fca5a5;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            transform: scale(1.15);
            z-index: 20;
        }
        
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <header class="w-full py-6 text-center shadow-md bg-slate-800 bg-opacity-50 border-b border-slate-700">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-widest number-font text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-yellow-200 to-yellow-400 drop-shadow-lg">
            BINGO <span class="font-normal text-2xl md:text-3xl tracking-normal text-white ml-2">PARTY</span>
        </h1>
    </header>

    <main class="flex-grow flex flex-col items-center justify-start py-8 px-4 w-full max-w-6xl mx-auto">
        
        <!-- メインの数字表示エリア -->
        <div class="relative flex flex-col items-center justify-center mb-8 w-full">
            <div class="absolute inset-0 bg-yellow-500 opacity-10 blur-3xl rounded-full w-64 h-64 mx-auto"></div>
            
            <div id="mainDisplayContainer" class="relative z-10 w-64 h-64 md:w-80 md:h-80 bg-slate-800 border-4 border-slate-600 rounded-full flex items-center justify-center shadow-2xl transition-all duration-300">
                <span id="currentNumber" class="text-8xl md:text-9xl font-black number-font text-slate-500 drop-shadow-md">
                    --
                </span>
            </div>
            
            <p id="drawCountText" class="mt-4 text-slate-400 font-bold tracking-wide">
                抽選回数: <span id="drawCount" class="text-white text-xl">0</span> / 75
            </p>
        </div>

        <!-- コントロールボタン -->
        <div class="flex flex-col sm:flex-row gap-4 mb-12 w-full justify-center max-w-md">
            <button id="drawBtn" class="flex-grow bg-gradient-to-b from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 active:from-yellow-500 active:to-yellow-700 text-slate-900 text-2xl font-bold py-4 px-8 rounded-full shadow-[0_4px_14px_0_rgba(234,179,8,0.39)] transition-all transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-yellow-500 focus:ring-opacity-50">
                🎲 番号を引く
            </button>
        </div>

        <!-- ビンゴボード（履歴） -->
        <div class="w-full bg-slate-800 bg-opacity-70 rounded-2xl p-6 shadow-xl border border-slate-700">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-bold text-slate-300">HISTORY BOARD</h2>
                <button id="showResetModalBtn" class="text-sm text-slate-400 hover:text-white transition-colors underline focus:outline-none">
                    🔄 ゲームをリセット
                </button>
            </div>
            
            <!-- 5列 (モバイル) -> 10列 (タブレット) -> 15列 (PC) -->
            <div id="historyGrid" class="grid grid-cols-5 sm:grid-cols-10 md:grid-cols-15 gap-2 md:gap-3">
                <!-- JavaScriptで1〜75までのセルが自動生成されます -->
            </div>
        </div>
    </main>

    <!-- リセット確認用モーダル (非表示状態) -->
    <div id="resetModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl max-w-md w-full p-8 transform transition-transform">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 text-red-600 mb-6">
                    <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">ゲームをリセットしますか？</h3>
                <p class="text-slate-400 mb-8">
                    これまでの抽選履歴がすべて消去され、最初からやり直しになります。この操作は取り消せません。
                </p>
                <div class="flex flex-col-reverse sm:flex-row gap-3 justify-center">
                    <button id="cancelResetBtn" class="w-full sm:w-auto bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500">
                        キャンセル
                    </button>
                    <button id="confirmResetBtn" class="w-full sm:w-auto bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-lg shadow-red-500/30 focus:outline-none focus:ring-2 focus:ring-red-500">
                        リセットする
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 状態管理 ---
        const TOTAL_NUMBERS = 75;
        let availableNumbers = [];
        let drawnNumbers = [];
        let isDrawing = false;

        // --- DOM要素の取得 ---
        const currentNumberDisplay = document.getElementById('currentNumber');
        const mainDisplayContainer = document.getElementById('mainDisplayContainer');
        const drawBtn = document.getElementById('drawBtn');
        const drawCountDisplay = document.getElementById('drawCount');
        const historyGrid = document.getElementById('historyGrid');
        
        // モーダル関連
        const resetModal = document.getElementById('resetModal');
        const showResetModalBtn = document.getElementById('showResetModalBtn');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');

        // --- 初期化処理 ---
        function initGame() {
            // 配列の初期化 (1〜75)
            availableNumbers = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + 1);
            drawnNumbers = [];
            
            // 表示の初期化
            currentNumberDisplay.textContent = "--";
            currentNumberDisplay.className = "text-8xl md:text-9xl font-black number-font text-slate-500 drop-shadow-md";
            mainDisplayContainer.classList.remove('border-yellow-400', 'glow-effect');
            mainDisplayContainer.classList.add('border-slate-600');
            
            updateDrawCount();
            renderGrid();
            
            // ボタンの有効化
            drawBtn.disabled = false;
            drawBtn.innerHTML = "🎲 番号を引く";
            drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // --- グリッドの描画 ---
        function renderGrid() {
            historyGrid.innerHTML = ''; // クリア
            for (let i = 1; i <= TOTAL_NUMBERS; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = "board-cell flex items-center justify-center h-12 sm:h-10 md:h-12 bg-slate-900 border border-slate-700 rounded text-slate-500 font-bold number-font text-lg";
                cell.textContent = i;
                historyGrid.appendChild(cell);
            }
        }

        // --- 回数表示の更新 ---
        function updateDrawCount() {
            drawCountDisplay.textContent = drawnNumbers.length;
        }

        // --- 番号を引くアニメーションと抽選ロジック ---
        function drawNumber() {
            if (isDrawing || availableNumbers.length === 0) return;

            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-80', 'scale-95');
            
            // アニメーション用クラスのリセット
            currentNumberDisplay.classList.remove('animate-pop', 'text-yellow-400', 'text-white');
            currentNumberDisplay.classList.add('text-slate-300');
            mainDisplayContainer.classList.remove('glow-effect', 'border-yellow-400');
            mainDisplayContainer.classList.add('border-slate-400');

            // 履歴ボードから前回の「最新」ハイライトを消す
            const prevLatest = document.querySelector('.board-cell.latest');
            if (prevLatest) {
                prevLatest.classList.remove('latest');
                prevLatest.classList.add('drawn');
            }

            let shuffleCount = 0;
            const maxShuffles = 30; // シャッフル回数
            const shuffleInterval = 50; // シャッフル速度(ms)

            // ドラムロール演出
            const timer = setInterval(() => {
                // シャッフル中はプール内からランダム表示（一時的）
                const tempIndex = Math.floor(Math.random() * availableNumbers.length);
                currentNumberDisplay.textContent = availableNumbers[tempIndex];
                
                shuffleCount++;

                if (shuffleCount >= maxShuffles) {
                    clearInterval(timer);
                    finalizeDraw();
                }
            }, shuffleInterval);
        }

        // --- 最終決定処理 ---
        function finalizeDraw() {
            // 本当の抽選
            const selectedIndex = Math.floor(Math.random() * availableNumbers.length);
            const actualNumber = availableNumbers[selectedIndex];

            // 状態の更新
            availableNumbers.splice(selectedIndex, 1); // 候補から削除
            drawnNumbers.push(actualNumber); // 履歴に追加

            // メイン表示の更新 (演出付き)
            currentNumberDisplay.textContent = actualNumber;
            currentNumberDisplay.className = "text-8xl md:text-9xl font-black number-font text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)] animate-pop";
            
            mainDisplayContainer.classList.remove('border-slate-400');
            mainDisplayContainer.classList.add('border-yellow-400', 'glow-effect');

            // 履歴ボードの更新
            const targetCell = document.getElementById(`cell-${actualNumber}`);
            if (targetCell) {
                targetCell.classList.remove('bg-slate-900', 'text-slate-500', 'border-slate-700');
                targetCell.classList.add('latest');
            }

            updateDrawCount();

            // 終了判定
            if (availableNumbers.length === 0) {
                drawBtn.disabled = true;
                drawBtn.classList.remove('active:from-yellow-500', 'hover:-translate-y-1', 'opacity-80', 'scale-95');
                drawBtn.classList.add('opacity-50', 'cursor-not-allowed', 'from-slate-500', 'to-slate-600');
                drawBtn.innerHTML = "✅ すべて引き終わりました";
            } else {
                drawBtn.disabled = false;
                drawBtn.classList.remove('opacity-80', 'scale-95');
            }

            isDrawing = false;
        }

        // --- モーダル制御ロジック ---
        function showModal() {
            if(isDrawing) return;
            resetModal.classList.remove('hidden');
            // 少し遅延させて透明度アニメーションを発火 (Tailwindのtransition用)
            setTimeout(() => {
                resetModal.classList.add('opacity-100');
                resetModal.querySelector('div').classList.add('scale-100');
                resetModal.querySelector('div').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function hideModal() {
            resetModal.classList.remove('opacity-100');
            resetModal.querySelector('div').classList.remove('scale-100');
            resetModal.querySelector('div').classList.add('scale-95', 'opacity-0');
            
            // アニメーション完了後に完全に非表示にする
            setTimeout(() => {
                resetModal.classList.add('hidden');
            }, 200);
        }

        // --- イベントリスナー設定 ---
        drawBtn.addEventListener('click', drawNumber);
        
        // モーダル開閉イベント
        showResetModalBtn.addEventListener('click', showModal);
        cancelResetBtn.addEventListener('click', hideModal);
        
        // リセット実行
        confirmResetBtn.addEventListener('click', () => {
            initGame();
            hideModal();
        });

        // モーダルの外側をクリックしたら閉じる
        resetModal.addEventListener('click', (e) => {
            if (e.target === resetModal) {
                hideModal();
            }
        });

        // 起動時の初期化
        window.onload = () => {
            initGame();
            // 初期状態のモーダルアニメーション用クラスセット
            resetModal.classList.add('opacity-0');
            resetModal.querySelector('div').classList.add('scale-95', 'opacity-0', 'transition-all', 'duration-200');
        };
    </script>
</body>
</html>
